{zh:"熟悉的公式 · 意外的答案",en:"A Familiar Formula",age:"今天 · 课堂",ageEn:"Today · in class",tag:"A FAMILIAR FORMULA",scale:"课本 / TEXTBOOK",temp:"似曾相识",

zhText:"牛顿在《自然哲学的数学原理》中以文字叙述第二定律：运动的变化正比于所施加的动力，并沿力的直线方向发生。",

zhVoice:"1687 年，牛顿出版《自然哲学的数学原理》。第二定律在原文中是一段拉丁文叙述——运动的变化与所施加的动力成正比，并沿该力所施加的直线方向发生。即使在运算时，牛顿也从未把第二定律写成数学等式，他总是以几何或比例的关系来描述。力和运动变化之间，似乎还与其它因素有关。",

zhText:"原文中的“运动”（motus）指我们今天所说的动量——质量乘以速度；“运动的变化”即动量的变化 Δp。",
enText:"In Newton's usage, “motion” (motus) means what we now call momentum — mass times velocity; the “change of motion” is the change of momentum, Δp.",
zhVoice:"由于年代与知识定义的差距，牛顿原著中的物理量与今天不尽相同。牛顿所说的运动（motus），指的是运动的量——质量乘以速度，也就是我们今天的动量；运动的变化（Mutationem motus）实际上是动量的变化，即现代的 Δp，在质量恒定时就是 mΔv。他还强调：力与动量变化成正比，而不是与质量和加速度的乘积成正比。",
enVoice:"Because definitions drift across centuries, Newton's quantities differ from ours. His motion, motus, is the quantity of motion — mass times velocity — our momentum; his change of motion is the change of momentum, Δp, or mΔv at constant mass. And he says force is proportional to the change of momentum, not to the product of mass and acceleration.",

{zh:"最贴近原文的公式",en:"F = Δp / Δt",age:"1687 → 今天",ageEn:"1687 → today",tag:"F = Δp / Δt",scale:"冲量与动量 / IMPULSE",temp:"mΔv / Δt",
zhText:"结合原著的计算，与牛顿意思最相近的写法其实是 F = Δp/Δt = mΔv/Δt——正是冲量与动量关系的变形。",

noteEn:"Only now does the law take the form found in today's textbooks."},
{zh:"1736 · 欧拉的一步之遥",en:"Euler, One Step Away",age:"1736 年",ageEn:"~1736",tag:"SO CLOSE, YET",scale:"巴塞尔 / BASEL",temp:"常数 × m × a",
zhText:"欧拉在《力学》中写出 F = 常数 × 质量 × 加速度——与 F = ma 仅一步之遥，差的正是单位。",
enText:"In his Mechanica, Euler wrote F = constant × mass × acceleration — one step away from F = ma; what was missing was the unit.",
zhVoice:"除了伐里农和伯努利，巴塞尔的著名数学家欧拉也贡献了自己的力量。1736 年，他在论文《力学》中写下了 F 等于常数乘以质量乘以加速度的公式。之所以欧拉离 F = ma 仅有一步之遥，其中一个原因在于单位——单位的精确定义直接决定着运算的方便程度和精度。而在牛顿的年代，人们对力并没有一个公认统一的大小衡量标准。",
enVoice:"Beyond Varignon and Bernoulli, the great Basel mathematician Euler made his own contribution. In 1736, in his Mechanica, he wrote the formula F = constant × mass × acceleration. Euler stood one step from F = ma — and what was missing was the unit. A precise definition of units determines the convenience and accuracy of calculation; in Newton's day there was no agreed standard for measuring force.",
note:"差的不是智慧，而是一套公认的单位。",
noteEn:"What was missing was not wisdom, but an agreed system of units."},
{zh:"单位的漫长之路",en:"The Long Road of Units",age:"1861 / 1948 年",ageEn:"1861 / 1948",tag:"ONE UNIT, TWO CENTURIES",scale:"国际度量衡 / SI UNITS",temp:"dyne → N",
zhText:"1861 年首次定出力的单位达因，距牛顿已近两百年；1948 年第 9 届国际度量衡会议采纳 newton 为国际标准单位，沿用至今。",
enText:"The dyne was defined in 1861 — nearly two centuries after Newton; in 1948 the 9th General Conference on Weights and Measures adopted the newton, in use ever since.",
zhVoice:"后人为了运算的方便与精确，直到 1861 年才首次订出力的单位达因，距离牛顿提出第二运动定律已近两百年。随后在 1948 年的第 9 届国际度量衡会议上，newton 被采纳为力的国际标准单位，沿用至今。从 1687 到 1948，这条公式走过的路，比我们想象的要长得多。",
enVoice:"For the sake of convenient and precise calculation, the dyne was first defined only in 1861 — nearly two hundred years after Newton stated the law. Then in 1948, the 9th General Conference on Weights and Measures adopted the newton as the international standard unit of force, in use to this day. From 1687 to 1948, this formula travelled a far longer road than we imagine.",
note:"单位的标准化，是公式走向通用工具的关键一步。",
noteEn:"Standardised units were the key step that turned a law into a universal tool."},
{zh:"质疑与正名",en:"Doubt and Due Credit",age:"后世",ageEn:"Later generations",tag:"CREDIT WHERE DUE",scale:"科学史 / HISTORIOGRAPHY",temp:"实至名归",
zhText:"有人质疑这条定律是否该冠牛顿之名；但通读《原理》并结合他的计算，第二定律冠上牛顿的名字实至名归。",
enText:"Some have doubted whether the law should bear Newton's name; read whole and together with his calculations, the credit is well deserved.",
zhVoice:"后人中有人质疑：牛顿第二定律是否应该说是牛顿提出来的？然而通篇阅览《原理》就会发现：运动量来自于速度与质量；运动力来自于加速度与质量的结合。虽然牛顿既没有把来自于写成等号，也没有把结合写成乘积，但结合他在书中的具体计算和分析，我们仍然认为第二定律冠上牛顿的名字实至名归。",
enVoice:"Some later readers have asked whether the second law should truly be credited to Newton. Yet read in full, the Principia states: quantity of motion arises from velocity and mass; motive force arises from the accelerative force taken jointly with the same quantity of matter. Newton wrote neither the equals sign nor the product — but together with his actual calculations and analyses, the credit is well deserved.",
note:"很多理论孤证难立，需要更多人为它发声才能被广泛认可。",
noteEn:"Theories rarely stand on a single witness; they need many voices to be widely accepted."},
{zh:"接力与凝练",en:"A Relay Across Generations",age:"1736 → 未来",ageEn:"1736 → the future",tag:"A RELAY ACROSS GENERATIONS",scale:"接力 / THE RELAY",temp:"几代人的接力",
zhText:"Δv/Δt 与 a 的微妙区别，为狭义相对论埋下伏笔；每个公式背后都不是一个人在战斗，而是几代人的接力。",
enText:"The subtle difference between Δv/Δt and a foreshadows special relativity; behind every formula stands not one person but generations in relay.",
zhVoice:"正是 F = Δp/Δt 与 F = ma 在表达式上微妙的区别，才造就了未来爱因斯坦狭义相对论的诞生。书本中的公式之所以清晰明了，与开创者密不可分，但后继者的优化同样功不可没。可以说，每个物理公式、每个物理量的单位背后，都不是一个人在战斗，而是一群人、甚至几代人智慧的结晶。学习物理，不仅要记住公式，更要理解公式的条件、知道公式的由来——只有这样，将来才有可能站在巨人的肩膀上，创造新的公式。",
enVoice:"Precisely the subtle difference between F = Δp/Δt and F = ma prepared the ground for Einstein's special relativity. Textbook formulas are clear thanks to their creators — but equally to those who refined them. Behind every formula and every unit stands not one person but a group, even generations, of collective wisdom. To learn physics is not merely to memorize formulas, but to understand their conditions and origins — only then may we stand on the shoulders of giants and create new formulas of our own.",
note:"参考文献：Newton (1687/1846)；Varignon (1707)；Bernoulli (1736)；Euler (1736/2008)。",
noteEn:"References: Newton (1687/1846); Varignon (1707); Bernoulli (1736); Euler (1736/2008)."}
];

class Heritage {
  constructor() {
    this.host = $('#bg-photos');
    this.fEl = $('#bg-formula');
    this.span = this.fEl.querySelector('span');
    this.credit = $('#bg-credit');
    this.imgs = {};
    for (const k of Object.keys(PORTRAITS)) {
      const im = document.createElement('img');
      im.src = PORTRAITS[k]; im.alt = ''; im.dataset.k = k;
      this.host.appendChild(im); this.imgs[k] = im;
    }
    this.cur = -1; this.token = 0;
    this.setEpoch(0, true);
  }
  setEpoch(i, snap) {
    if (i === this.cur && !snap) return;
    this.cur = i;
    const cfg = STAGE_BG[i] || STAGE_BG[0];
    const host = this.host;
    if (cfg.img === 'all') {                       /* 终章：四代接力 */
      host.className = 'lay-row';
      ['newton','varignon','bernoulli','euler'].forEach((k, idx) => {
        const im = this.imgs[k];
        im.style.left = (45 + idx * 13.5) + '%';
        im.classList.add('active');
      });
      this.credit.textContent = CREDIT.all;
    } else {
      host.className = 'lay-right';
      for (const k of Object.keys(this.imgs)) {
        this.imgs[k].classList.toggle('active', k === cfg.img);
        if (k !== cfg.img) this.imgs[k].style.left = '';
      }
      this.credit.textContent = cfg.img ? (CREDIT[cfg.img] || '') : '';
    }
    const my = ++this.token;                       /* 公式字景：淡出→换字→淡入 */
    this.fEl.classList.remove('show');
    setTimeout(() => {
      if (my !== this.token) return;
      this.span.textContent = cfg.f;
      this.fEl.classList.add('show');
    }, snap ? 60 : 520);
  }
  frame() { /* 背景由 CSS 过渡驱动，无需逐帧 */ }
}
/* ================= 声音：环境音（WebAudio 合成）+ 解说（系统语音） ================= */
const Sound = {
  ctx: null, ready: false, ambience: false, effects: false, mode: 'off',
  init() {
    if (this.ready) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0; this.master.connect(this.ctx.destination);
      this.filter = this.ctx.createBiquadFilter(); this.filter.type = 'lowpass';
      this.filter.frequency.value = 620; this.filter.Q.value = 0.7; this.filter.connect(this.master);
      this.o1 = this.ctx.createOscillator(); this.o1.type = 'sine';
      this.o2 = this.ctx.createOscillator(); this.o2.type = 'triangle';
      this.g1 = this.ctx.createGain(); this.g1.gain.value = 0.6;
      this.g2 = this.ctx.createGain(); this.g2.gain.value = 0.22;
      this.o1.connect(this.g1); this.g1.connect(this.filter);
      this.o2.connect(this.g2); this.g2.connect(this.filter);
      this.o1.frequency.value = 49; this.o2.frequency.value = 73.5;
      this.o1.start(); this.o2.start();
      const len = this.ctx.sampleRate * 2;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.ready = true;
      return true;
    } catch (e) { return false; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setEpoch(i) {
    if (!this.ready) return;
    const f = HZ[i] || 55;
    const now = this.ctx.currentTime;
    this.o1.frequency.cancelScheduledValues(now);
    this.o2.frequency.cancelScheduledValues(now);
    this.o1.frequency.setTargetAtTime(f, now, 0.9);
    this.o2.frequency.setTargetAtTime(f * 1.5, now, 0.9);
    this.filter.frequency.setTargetAtTime(520 + i * 90, now, 0.9);
  },
  setAmbience(on) {
    this.ambience = on;
    if (!this.ready) return;
    this.master.gain.setTargetAtTime(on ? 0.05 : 0, this.ctx.currentTime, 0.5);
  },
  chime() {
    if (!this.ready || !this.effects) return;
    const c = this.ctx, now = c.currentTime;
    const src = c.createBufferSource(); src.buffer = this.noise;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(320, now); bp.frequency.exponentialRampToValueAtTime(2400, now + 0.55);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.10, now + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
    src.connect(bp); bp.connect(g); g.connect(c.destination);
    src.start(now); src.stop(now + 0.75);
  },
  narrate(i) {
    if (this.mode === 'off' || !('speechSynthesis' in window)) return;
    const e = EPOCHS[i]; if (!e) return;
    window.speechSynthesis.cancel();
    const say = (txt, lang) => {
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = lang; u.rate = lang === 'zh-CN' ? 1 : 0.96;
      window.speechSynthesis.speak(u);
    };
    if (this.mode === 'zh') say(e.zhVoice, 'zh-CN');
    else if (this.mode === 'en') say(e.enVoice, 'en-US');
    else { say(e.zhVoice, 'zh-CN'); say(e.enVoice, 'en-US'); }
  },
  stopNarration() { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); }
};

      '<div class="narration-options">' +
        [['off', '关闭', 'Off'], ['zh', '中文', '中文'], ['en', 'English', 'English'], ['both', '双语', 'Both']].map(function (o) {
          return '<label><input type="radio" name="narration-mode" value="' + o[0] + '"' + (o[0] === 'off' ? ' checked' : '') + '><span>' + ze(o[1], o[2]) + '</span></label>';

/* ================= 控制器 ================= */
const App = {
  lang: 'zh', playing: false, Rt: 0, Ge: 0, speed: 1, started: false,
  scrubbing: false, resumeAfterScrub: false, visits: 1,

  load() { try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { return {}; } },
  save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        lang: this.lang, speed: this.speed, visits: this.visits,
        narration: Sound.mode, ambience: Sound.ambience, effects: Sound.effects
      }));
    } catch (e) {}
  },

  init() {
    const s = this.load();
    this.visits = (s.visits || 0) + 1;
    this.lang = s.lang || 'zh';
    this.speed = s.speed || 1;
    Sound.mode = s.narration || 'off';
    Sound.ambience = !!s.ambience; Sound.effects = !!s.effects;
    $('#site-visit-count').textContent = this.visits;

    this.heritage = new Heritage();

    this.applyLang();
    this.syncChapterUI();
    this.renderNote();
    this.syncAudioPanel();
    Sound.setEpoch(0);
    $('#speed').textContent = this.speed + '×';
    $('#clock').innerHTML = '00:00 <em>/ ' + fmt(TOTAL) + '</em>';

    this.bind();
    this.save();
    requestAnimationFrame((t) => { this.last = t; this.loop(t); });
  },

  bind() {
    const self = this;
    $('#begin').onclick = () => { Sound.init(); Sound.resume(); self.start(); $('#play').focus(); };
    document.querySelector('.brand').onclick = (e) => { e.preventDefault(); self.goIntro(); };
    $('#play').onclick = () => { Sound.init(); Sound.resume(); self.togglePlay(); };
    $('#restart').onclick = () => { self.seekTime(0); if (!self.playing) self.setPlay(true); self.toast(L('已从头开始', 'Restarted from the beginning')); };
    $('#speed').onclick = () => {
      const opts = [0.5, 1, 1.5, 2];
      self.speed = opts[(opts.indexOf(self.speed) + 1) % 4];
      $('#speed').textContent = self.speed + '×'; self.save();
    };
    $('#previous').onclick = () => self.step(-1);
    $('#next').onclick = () => self.step(1);
    $('#language').onclick = () => { self.lang = self.lang === 'zh' ? 'en' : 'zh'; self.applyLang(); self.syncChapterUI(); self.renderNote(); self.save(); };
    $('#chapters-button').onclick = () => self.openDialog('chapter-dialog');
    $('#science-button').onclick = () => self.openDialog('science-dialog');
    $('#notes-button').onclick = () => self.openDialog('science-dialog');
    document.querySelectorAll('[data-close]').forEach((b) =>
      b.onclick = () => { const d = document.getElementById(b.dataset.close); if (d && d.open) d.close(); });
    document.querySelectorAll('[data-chapter]').forEach((b) =>
      b.onclick = () => { const i = +b.dataset.chapter; self.start(); self.seekTime(i * EPOCH_SEC + 0.05); document.getElementById('chapter-dialog').close(); });
    document.querySelectorAll('.epoch-dot').forEach((b) =>
      b.onclick = (e) => { e.stopPropagation(); const i = +b.dataset.epoch; self.start(); self.seekTime(i * EPOCH_SEC + 0.05); });

    /* 音频面板 */
    $('#audio-button').onclick = () => {
      const p = $('#audio-panel');
      p.hidden = !p.hidden;
      $('#audio-button').setAttribute('aria-expanded', String(!p.hidden));
      if (!p.hidden) { Sound.init(); Sound.resume(); }
    };
    $('#audio-close').onclick = () => { $('#audio-panel').hidden = true; $('#audio-button').setAttribute('aria-expanded', 'false'); };
    document.querySelectorAll('input[name=narration-mode]').forEach((r) => {
      r.checked = r.value === Sound.mode;
      r.onchange = () => {
        Sound.mode = r.value; Sound.init(); Sound.resume();
        if (Sound.mode === 'off') Sound.stopNarration();
        else if (self.playing) Sound.narrate(self.Ge);
        self.syncAudioPanel(); self.save();
      };
    });
    $('#audio-ambience').onchange = (e) => { Sound.init(); Sound.resume(); Sound.setAmbience(e.target.checked); self.save(); };
    $('#audio-effects').onchange = (e) => { Sound.effects = e.target.checked; if (Sound.effects) { Sound.init(); Sound.resume(); } self.save(); };

    /* 时间轴 */
    const tl = $('#timeline');
    tl.addEventListener('pointerdown', () => { self.scrubbing = true; self.resumeAfterScrub = self.playing; Sound.stopNarration(); });
    tl.addEventListener('input', () => { self.seekTime(parseFloat(tl.value)); });
    const endScrub = () => {
      if (!self.scrubbing) return;
      self.scrubbing = false;
      if (self.resumeAfterScrub && self.Rt < TOTAL) { self.setPlay(true); Sound.narrate(self.Ge); }
      else self.setPlay(false);
    };
    tl.addEventListener('pointerup', endScrub);
    tl.addEventListener('pointercancel', endScrub);
    tl.addEventListener('change', endScrub);

    $('#fullscreen').onclick = () => {
      const el = document.documentElement;
      if (!document.fullscreenElement) { (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el); }
      else { (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document); }
    };

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
      if (e.code === 'Space') { e.preventDefault(); if (self.started) self.togglePlay(); else { Sound.init(); self.start(); } }
      else if (e.key === 'ArrowRight') { e.preventDefault(); self.step(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); self.step(-1); }
      else if (e.key === 'f' || e.key === 'F') $('#fullscreen').click();
      else if (e.key === 'Escape') {
        document.querySelectorAll('dialog[open]').forEach((d) => d.close());
        $('#audio-panel').hidden = true;
      }
    });
    window.addEventListener('beforeunload', () => this.save());
  },

  /* ---- 语言 ---- */
  applyLang() {
    document.documentElement.lang = this.lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-zh]').forEach((el) => {
      el.textContent = this.lang === 'zh' ? el.dataset.zh : el.dataset.en;
    });
    $('#language').innerHTML = this.lang === 'zh' ? '中 <span>/ EN</span>' : 'EN <span>/ 中</span>';
  },

  /* ---- 播放 ---- */
  start() {
    if (this.started) return;
    this.started = true;
    $('#intro').hidden = true; $('#journey').hidden = false;
    $('#experience').classList.remove('intro-mode');
    this.setPlay(true);
    Sound.narrate(this.Ge);
  },
  goIntro() {
    this.setPlay(false); Sound.stopNarration();
    this.started = false; this.Rt = 0; this.Ge = 0;
    $('#intro').hidden = false; $('#journey').hidden = true;
    $('#experience').classList.add('intro-mode');
    this.heritage.setEpoch(0, true);
    this.syncTime(); this.syncChapterUI();
  },
  togglePlay() { this.setPlay(!this.playing); },
  setPlay(on) {
    this.playing = on;
    $('#play').innerHTML = svg(on ? 'pause' : 'play') + (this.lang === 'zh' ? (on ? '暂停' : '自动播放') : (on ? 'Pause' : 'Play'));
    $('#play').setAttribute('aria-label', this.lang === 'zh' ? (on ? '暂停' : '自动播放') : (on ? 'Pause' : 'Play'));
    $('#experience').classList.toggle('playing', on);
    document.querySelector('.scene-status').classList.toggle('paused', !on);
    document.querySelector('.scene-status').innerHTML = '<i></i>' + (this.lang === 'zh' ? (on ? '定律演化进行中' : '已暂停') : (on ? 'THE LAW EVOLVES' : 'PAUSED'));
    if (!on) Sound.stopNarration();
  },
  step(d) {
    if (!this.started) { this.start(); return; }
    const i = Math.min(N - 1, Math.max(0, this.Ge + d));
    this.seekTime(i * EPOCH_SEC + 0.05);
    if (!this.playing) this.setPlay(true);
  },
  seekTime(sec) {
    this.Rt = Math.min(TOTAL, Math.max(0, sec));
    const i = Math.min(N - 1, Math.floor(this.Rt / EPOCH_SEC));
    if (i !== this.Ge) { this.Ge = i; this.onChapter(); }
    this.syncTime();
  },
  onChapter() {
    this.syncChapterUI();
    this.renderNote();
    Sound.setEpoch(this.Ge);
    Sound.chime();
    if (this.playing && !this.scrubbing) Sound.narrate(this.Ge);
    document.querySelectorAll('[data-chapter]').forEach((b, k) => {
      b.classList.toggle('selected', k === this.Ge && this.started);
      b.setAttribute('aria-current', String(k === this.Ge && this.started));
    });
  },

  /* ---- 界面同步 ---- */
  syncChapterUI() {
    const e = EPOCHS[this.Ge], zh = this.lang === 'zh';
    const cap = $('#scene-caption');
    cap.classList.remove('swap'); void cap.offsetWidth; cap.classList.add('swap');
    $('#epoch-number').textContent = String(this.Ge + 1).padStart(2, '0');
    $('#epoch-tag').textContent = e.tag;
    $('#epoch-age').textContent = (zh ? '纪元年代 · ' : 'EPOCH · ') + (zh ? e.age : e.ageEn);
    $('#epoch-title').textContent = zh ? e.zh : e.en;
    $('#epoch-english').textContent = zh ? e.en : e.zh;
    $('#subtitle-primary').textContent = zh ? e.zhText : e.enText;
    $('#subtitle-secondary').textContent = zh ? e.enText : e.zhText;   /* 与对标站一致：副行为另一语言对照 */
    $('#scene-scale').textContent = e.scale;
    $('#detail-value').textContent = e.temp;
    $('#step-name').textContent = zh ? e.zh : e.en;
    $('#timeline').setAttribute('aria-valuetext', (zh ? e.zh : e.en) + '，' + (zh ? e.age : e.ageEn));
    document.querySelectorAll('.epoch-dot').forEach((d, k) => {
      d.classList.toggle('active', k === this.Ge && this.started);
      d.classList.toggle('visited', k < this.Ge);
    });
    const amb = $('#ambience-description');
    if (amb) amb.textContent = zh ? (AMB[this.Ge][0] + ' · ' + AMB[this.Ge][1]) : (AMBE[this.Ge][0] + ' · ' + AMBE[this.Ge][1]);
  },
  renderNote() {
    const e = EPOCHS[this.Ge], zh = this.lang === 'zh';
    const box = $('#current-note'); if (!box) return;
    box.innerHTML = '<div class="note-caveat" style="margin-top:0">' + (zh ? e.note : e.noteEn) + '</div>';
  },

  syncTime() {
    if (!this.scrubbing) $('#timeline').value = String(this.Rt);
    $('#track-fill').style.width = (this.Rt / TOTAL * 100) + '%';
    $('#clock').innerHTML = fmt(this.Rt) + ' <em>/ ' + fmt(TOTAL) + '</em>';
  },
  syncAudioPanel() {
    const st = $('#audio-status');
    const zh = this.lang === 'zh';
    if (!('speechSynthesis' in window)) {
      st.dataset.state = 'unavailable';
      st.textContent = zh ? '此浏览器不支持语音解说；动画与字幕继续播放。' : 'Speech unavailable here; captions and animation continue.';
    } else if (Sound.mode === 'off') {
      st.dataset.state = '';
      st.textContent = zh ? '解说已关闭。选择中文或双语，随旅程朗读。' : 'Narration off. Pick Chinese or Both to hear it.';
    } else {
      st.dataset.state = '';
      st.textContent = this.playing
        ? (zh ? '正在播放' + (Sound.mode === 'zh' ? '中文' : Sound.mode === 'en' ? '英文' : '双语') + '解说…' : 'Narrating in ' + Sound.mode + '…')
        : (zh ? '解说已就绪，继续旅程后播放。' : 'Ready — narration starts when the journey resumes.');
    }
    $('#audio-button').classList.toggle('enabled', Sound.mode !== 'off' || Sound.ambience);
    $('#audio-ambience').checked = Sound.ambience;
    $('#audio-effects').checked = Sound.effects;
  },
  openDialog(id) {
    const d = document.getElementById(id);
    if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
    if (id === 'chapter-dialog') {
      document.querySelectorAll('[data-chapter]').forEach((b, k) => {
        b.classList.toggle('selected', k === this.Ge && this.started);
      });
    }
  },
  toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('visible');
    clearTimeout(this._tt); this._tt = setTimeout(() => t.classList.remove('visible'), 5000);
  },

  loop(ms) {
    const dt = Math.min(0.06, (ms - this.last) / 1000); this.last = ms;
    if (this.playing && !this.scrubbing) {
      this.Rt += dt * this.speed;
      if (this.Rt >= TOTAL) { this.Rt = TOTAL; this.setPlay(false); this.toast(L('演化抵达今天。下一个公式，等你来写。', 'The journey reaches today. The next formula is yours to write.')); }
      const i = Math.min(N - 1, Math.floor(this.Rt / EPOCH_SEC));
      if (i !== this.Ge) { this.Ge = i; this.onChapter(); }
      this.syncTime();
      this._acc = (this._acc || 0) + dt;
      if (this._acc > 5) { this._acc = 0; this.save(); }
    }
    this.heritage.setEpoch(this.started ? this.Ge : 0);
    requestAnimationFrame((x) => this.loop(x));
  }
};
function fmt(s) {
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s / 60), r = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
}
function L(zh, en) { return App.lang === 'zh' ? zh : en; }

/* =========================================================================
   数字化教材嵌入桥 · Embed Bridge（新增，不改动原有任何逻辑）
   ----------------------------------------------------------------------
   URL 参数（直接拼在 iframe 的 src 上即可）：
     ?embed=1     强制嵌入模式（也可由环境自动判定：处于 iframe 中即启用）
     ?chapter=2   深链：直接停在第三章（0 基，0 … N-1）
     ?lang=en     初始语言 en / zh
     ?auto=1      加载后自动开始播放（无用户手势时解说保持关闭，安全）
   子 → 父 postMessage（msg.source === 'fma-journey'）：
     ready   { chapters:[{index,zh,en,age,ageEn,tag,time}], total, epochSec, lang }
     chapter { index, zh, en, time }
     state   { playing, started, time, total, chapter, lang }   每 500ms 一次
   父 → 子 postMessage（msg.target === 'fma-journey'）：
     {type:'fma:goto', index:2}        跳到第二章
     {type:'fma:play'} / {'fma:pause'} / {'fma:toggle'} / {'fma:restart'}
     {type:'fma:next'} / {'fma:prev'}
     {type:'fma:lang', lang:'en'}
     {type:'fma:ping'}                 立即回传一次 state
   ========================================================================= */
var EMBED_Q = new URLSearchParams(location.search);
var IS_EMBED = EMBED_Q.get('embed') === '1' || (function () { try { return window.self !== window.top; } catch (e) { return true; } })();

/* ===== 逐人行为上报（beacon）=====
   默认 BEACON_URL 为空 → 不发任何数据，保持纯离线。
   部署腾讯云 SCF 接收端点后，把网关地址填入此处即可开启上报。
   数据：匿名 client_id（每浏览器随机 UUID，不关联身份）+ 章节/语言/累计时长/事件类型。
   接收端示例见 scf/ 目录（Python SCF 写 CLS 日志）。 */
var BEACON_URL = "";
function fmaCid() {
  try {
    var c = localStorage.getItem('fma_cid');
    if (!c) {
      c = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : 'c' + Date.now().toString(36) + Math.random().toString(16).slice(2);
      localStorage.setItem('fma_cid', c);
    }
    return c;
  } catch (e) { return 'anon'; }
}
var _fmaLastBeat = 0;
function fmaBeacon(p) {
  if (!BEACON_URL) return;
  try {
    var now = Date.now();
    if (p && p.type === 'state') { if (now - _fmaLastBeat < 5000) return; _fmaLastBeat = now; }
    var rec = {
      cid: fmaCid(), type: p ? p.type : '?',
      chapter: p ? p.chapter : null, lang: p ? p.lang : null,
      time: p ? p.time : null, ts: now,
      ua: (navigator.userAgent || '').slice(0, 120),
      ref: (document.referrer || '').slice(0, 200), v: 1
    };
    // 用 text/plain 走「简单请求」：跨域时不触发浏览器预检(OPTIONS)，
    // 即使函数 URL 没开 CORS 响应头，数据照样能进 SCF。SCF 端按原始文本 json.loads 即可。
    var blob = new Blob([JSON.stringify(rec)], { type: 'text/plain' });
    if (navigator.sendBeacon) navigator.sendBeacon(BEACON_URL, blob);
    else { var x = new XMLHttpRequest(); x.open('POST', BEACON_URL, true); x.setRequestHeader('Content-Type', 'text/plain'); x.send(JSON.stringify(rec)); }
  } catch (e) {}
}

function fmaPost(msg) {
  if (IS_EMBED) {
    try {
      var payload = { source: 'fma-journey' };
      for (var k in msg) { if (Object.prototype.hasOwnProperty.call(msg, k)) payload[k] = msg[k]; }
      window.parent.postMessage(payload, '*');
    } catch (e) {}
  }
  fmaBeacon(msg);
}
function fmaChapters() {
  return EPOCHS.map(function (e, i) {
    return { index: i, zh: e.zh, en: e.en, age: e.age, ageEn: e.ageEn, tag: e.tag, time: i * EPOCH_SEC };
  });
}
function fmaState() {
  return { type: 'state', playing: App.playing, started: App.started,
    time: Math.round(App.Rt * 10) / 10, total: TOTAL, chapter: App.Ge, lang: App.lang };
}
function fmaGoto(i) {
  i = Math.max(0, Math.min(EPOCHS.length - 1, i | 0));
  try { App.start(); } catch (e) {}
  App.seekTime(i * EPOCH_SEC + 0.05);
  fmaPost({ type: 'chapter', index: App.Ge, zh: EPOCHS[App.Ge].zh, en: EPOCHS[App.Ge].en, time: Math.round(App.Rt) });
  fmaPost(fmaState());
}
function installEmbedBridge() {
  var ql = (EMBED_Q.get('lang') || '').toLowerCase();
  if (ql === 'en' || ql === 'zh') {
    App.lang = ql;
    try { App.applyLang(); App.syncChapterUI(); App.renderNote(); App.save(); } catch (e) {}
  }

  var _onChapter = App.onChapter;
  App.onChapter = function () {
    _onChapter.call(this);
    if (!this.started) return;
    fmaPost({ type: 'chapter', index: this.Ge, zh: EPOCHS[this.Ge].zh, en: EPOCHS[this.Ge].en, time: Math.round(this.Rt) });
    fmaPost(fmaState());
  };
  var _setPlay = App.setPlay;
  App.setPlay = function (on) { _setPlay.call(this, on); fmaPost(fmaState()); };

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || typeof d !== 'object') return;
    if (d.target && d.target !== 'fma-journey') return;
    if (typeof d.type !== 'string' || d.type.indexOf('fma:') !== 0) return;
    switch (d.type) {
      case 'fma:goto':    fmaGoto(d.index); break;
      case 'fma:next':    try { App.step(1); } catch (e) {} fmaPost(fmaState()); break;
      case 'fma:prev':    try { App.step(-1); } catch (e) {} fmaPost(fmaState()); break;
      case 'fma:play':    if (!App.started) { try { App.start(); } catch (e) {} } else { App.setPlay(true); } fmaPost(fmaState()); break;
      case 'fma:pause':   App.setPlay(false); fmaPost(fmaState()); break;
      case 'fma:toggle':  if (!App.started) { try { App.start(); } catch (e) {} } else { App.togglePlay(); } fmaPost(fmaState()); break;
      case 'fma:restart': App.seekTime(0); if (!App.playing) App.setPlay(true); fmaPost(fmaState()); break;
      case 'fma:lang':    if (d.lang === 'en' || d.lang === 'zh') { App.lang = d.lang; App.applyLang(); App.syncChapterUI(); App.renderNote(); App.save(); fmaPost(fmaState()); } break;
      case 'fma:ping':    fmaPost(fmaState()); break;
    }
  });

  var qc = EMBED_Q.get('chapter');
  if (qc !== null && qc !== '') {
    var i = parseInt(qc, 10);
    if (!isNaN(i)) setTimeout(function () {
      fmaGoto(i);
      if (EMBED_Q.get('auto') !== '1') { try { App.setPlay(false); } catch (e) {} }
    }, 80);
  } else if (EMBED_Q.get('auto') === '1') {
    setTimeout(function () { try { App.start(); } catch (e) {} }, 80);
  }

  setInterval(function () { fmaPost(fmaState()); }, 500);

  var sayReady = function () {
    fmaPost({ type: 'ready', chapters: fmaChapters(), total: TOTAL, epochSec: EPOCH_SEC, lang: App.lang });
  };
  sayReady();
  setTimeout(sayReady, 300);

  window.addEventListener('beforeunload', function () {
    fmaBeacon({ type: 'exit', chapter: App.Ge, lang: App.lang, time: Math.round(App.Rt) });
  });
}

document.addEventListener('DOMContentLoaded', function () {
  App.init();
  try { installEmbedBridge(); } catch (e) { /* 桥异常不影响原页面 */ }
});
</script>
</body>
</html>
